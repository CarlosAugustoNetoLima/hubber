<!-- Onde a escolha sobre medição é guardada e aplicada -->
<script>
(function(){
  var CHAVE = 'hubber:consentimento';
  var VERSAO = 1;
  var ouvintes = [];

  function registro(){
    try {
      var bruto = window.localStorage.getItem(CHAVE);
      if (!bruto) return null;
      var d = JSON.parse(bruto);
      if (!d) return null;
      // Versão diferente quer dizer que as finalidades mudaram desde o aviso, e
      // ele aparece de novo. Menos para quem desativou a medição: esse pedido
      // vale até a própria pessoa desfazer, por mais que o aviso mude.
      return d.versao === VERSAO || d.estado === 'recusado' ? d : null;
    } catch (e) { return null; }
  }

  /* Aviso com saída: a medição vale para todo mundo que não pediu para sair.
     Quem recusou quando a tarja ainda pedia autorização antes continua fora,
     porque o registro é o mesmo. */
  function permitido(){
    var d = registro();
    return !d || d.estado !== 'recusado';
  }

  // Desativar a medição não é só parar de mandar evento: o que já foi gravado
  // no navegador sai também. O domínio do cookie depende de como o fbevents o
  // gravou, então apaga nos escopos possíveis.
  function apagarCookies(){
    var host = location.hostname;
    var raiz = host.split('.').slice(-2).join('.');
    var escopos = ['', '; domain=' + host, '; domain=.' + host, '; domain=' + raiz, '; domain=.' + raiz];
    ['_fbp', '_fbc'].forEach(function(nome){
      escopos.forEach(function(escopo){
        document.cookie = nome + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/' + escopo;
      });
    });
  }

  window.consentimento = {
    // null = ainda não viu o aviso, o que não impede a medição.
    registro: registro,
    permitido: permitido,
    // Quem depende da medição se inscreve aqui. Se ela está valendo, roda na
    // hora, para o PageView sair junto com a página.
    aoPermitir: function(fn){
      ouvintes.push(fn);
      if (permitido()) fn();
    },
    registrar: function(estado){
      try {
        window.localStorage.setItem(CHAVE, JSON.stringify({
          estado: estado,
          em: new Date().toISOString(),
          versao: VERSAO
        }));
      } catch (e) {}
      if (estado === 'recusado') apagarCookies();
      else ouvintes.forEach(function(fn){ fn(); });
    }
  };
})();
</script>
