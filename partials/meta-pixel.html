<!-- Pixel da Meta. Carrega para quem não desativou a medição; ver partial consentimento-api -->
<script>
(function(){
  var ID = '{{1}}';

  /* A página fala com o pixel por aqui, nunca direto pelo fbq. Para quem
     desativou a medição o fbq não existe, e cada método vira um no-op
     silencioso: quem dispara um evento não precisa saber da escolha. */
  function identificador(nome){
    var sorteio = (window.crypto && window.crypto.randomUUID)
      ? window.crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(36).slice(2);
    return nome + '.' + sorteio;
  }

  window.pixel = {
    id: ID,
    // O gateway da Conversions API manda uma cópia de cada evento pelo
    // servidor. É pelo eventID que a Meta reconhece a cópia e conta uma vez só.
    evento: function(nome, dados){
      if (typeof window.fbq !== 'function') return;
      window.fbq('track', nome, dados || {}, { eventID: identificador(nome) });
    },
    /* Correspondência avançada. O SDK normaliza e embaralha no navegador antes
       de mandar, então a Meta recebe o resumo, não o e-mail. Só depois de um
       envio: é quando a pessoa entregou o dado sabendo para quê. */
    identificar: function(dados){
      if (typeof window.fbq !== 'function') return;
      window.fbq('init', ID, dados);
    }
  };

  if (!window.consentimento) return;
  var carregado = false;

  window.consentimento.aoPermitir(function(){
    if (carregado) return;
    carregado = true;
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init', ID);
    window.fbq('track', 'PageView');
  });
})();
</script>
<!-- Fim do pixel da Meta -->
